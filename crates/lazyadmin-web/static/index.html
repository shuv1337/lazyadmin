<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lazyadmin</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name">lazyadmin</span>
    <span class="brand-host" id="hostLabel">localhost</span>
  </div>
  <nav class="rail" id="rail" aria-label="primary"></nav>
  <div class="status" id="statusBlock">
    <span class="pip" id="pipDot" data-state="loading" aria-hidden="true"></span>
    <span class="pip-label" id="pipLabel">connecting…</span>
    <span class="pip-meta" id="pipMeta"></span>
    <button type="button" class="palette-trigger" id="paletteTrigger" title="Search (press /)">
      <kbd>/</kbd> search
    </button>
  </div>
</header>

<main id="main" class="main">
  <section id="page" class="page" aria-live="polite"></section>
</main>

<aside id="inspector" class="inspector" hidden>
  <div class="inspector-head">
    <h2 id="inspectorTitle">Inspector</h2>
    <div class="inspector-actions">
      <label class="raw-toggle">
        <input type="checkbox" id="rawToggle"> show raw
      </label>
      <button type="button" id="inspectorClose" class="ghost" aria-label="Close inspector">×</button>
    </div>
  </div>
  <div id="inspectorBody" class="inspector-body"></div>
</aside>

<dialog id="palette" class="palette">
  <form id="paletteForm" method="dialog">
    <input id="paletteInput" type="text" autocomplete="off" placeholder="jump to view, listener, project, warning…">
    <ul id="paletteResults" class="palette-results" role="listbox"></ul>
    <p class="palette-hint">substring match · prefix with <code>~</code> for fuzzy</p>
  </form>
</dialog>

<script type="module" src="/static/app.js"></script>
</body>
</html>
