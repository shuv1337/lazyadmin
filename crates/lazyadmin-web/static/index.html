<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lazyadmin web</title><style>
:root{color-scheme:dark;--bg:#011627;--panel:#071d2f;--line:#1d3b53;--fg:#d6deeb;--muted:#637777;--accent:#82aaff;--warn:#f78c6c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-sans-serif,system-ui}header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 18px;background:#061a2a;position:sticky;top:0}h1{font-size:15px;margin:0;color:#ecc48d}.shell{display:grid;grid-template-columns:190px 1fr 360px;min-height:calc(100vh - 52px)}nav{border-right:1px solid var(--line);padding:14px;background:#041827}nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--fg);border:0;border-radius:8px;padding:9px 10px;margin:2px 0;cursor:pointer}nav button.active,nav button:hover{background:var(--line)}main{padding:16px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.card strong{display:block;font-size:24px;color:var(--accent)}.toolbar{display:flex;gap:10px;margin:0 0 12px}input{background:#061a2a;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px;min-width:260px}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}th{position:sticky;top:68px;background:#082036;color:#addb67;cursor:pointer}tr:hover,tr.selected{background:#0d2a42}aside{border-left:1px solid var(--line);padding:16px;background:#041827;overflow:auto}pre{white-space:pre-wrap;word-break:break-word;color:#d6deeb}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px}.public{color:var(--warn)}@media(max-width:900px){.shell{grid-template-columns:1fr}nav,aside{border:0}.shell aside{display:none}}</style></head>
<body><header><h1>lazyadmin</h1><span id="status" class="muted">loading snapshot…</span><span id="age" class="pill">—</span></header><div class="shell"><nav id="nav"></nav><main><section class="cards" id="cards"></section><div class="toolbar"><input id="q" placeholder="Filter current table"><label><input id="system" type="checkbox"> include system</label></div><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></main><aside><h2>Inspector</h2><div id="inspector" class="muted">Select a row.</div></aside></div><script>
const views=['Overview','Listeners','Public','Conflicts','Workloads','Processes','Projects','Managers','Tracked runs','Warnings','Discovery health'];let snap=null,view=new URLSearchParams(location.search).get('view')||'Listeners',selected=null,sortKey='',sortDir=1;
const nav=document.querySelector('#nav'),tbody=document.querySelector('#tbody'),thead=document.querySelector('#thead'),cards=document.querySelector('#cards'),q=document.querySelector('#q');
function setParam(k,v){const u=new URL(location);v?u.searchParams.set(k,v):u.searchParams.delete(k);history.replaceState(null,'',u)}
views.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{view=v;setParam('view',v);render()};nav.appendChild(b)});q.value=new URLSearchParams(location.search).get('q')||'';q.oninput=()=>{setParam('q',q.value);renderTable()};
async function load(){try{const r=await fetch('/api/snapshot');if(!r.ok)throw new Error(await r.text());snap=await r.json();document.querySelector('#status').textContent=`${snap.metadata?.host?.hostname||'local host'} · ${snap.listeners.length} listeners · ${snap.processes.length} processes`;document.querySelector('#age').textContent='fresh';render()}catch(e){document.querySelector('#status').textContent='API error';tbody.innerHTML=`<tr><td>${e.message}</td></tr>`}}setInterval(load,5000);load();
function counts(){return {listeners:snap.listeners.length,public:snap.listeners.filter(publicL).length,workloads:snap.workloads.length,processes:snap.processes.length,managers:snap.managers.length,projects:snap.projects.length,runs:snap.tracked_runs.length,warnings:snap.warnings.length}}
function render(){[...nav.children].forEach(b=>b.classList.toggle('active',b.textContent==view));cards.innerHTML='';if(!snap)return;Object.entries(counts()).forEach(([k,v])=>cards.innerHTML+=`<div class=card><span class=muted>${k}</span><strong>${v}</strong></div>`);renderTable()}
function publicL(l){return !['Loopback','UnixLocal','loopback','unix_local'].includes(String(l.exposure))}
function warnCount(id){return snap.warnings.filter(w=>JSON.stringify(w.entity||'').includes(id)).length}
function rows(){if(!snap)return[];let r=[];if(view=='Listeners'||view=='Public'||view=='Conflicts')r=snap.listeners.map(l=>({id:l.id,kind:'listener',Port:l.port||'',Protocol:l.protocol,Bind:l.bind_addr||l.unix_path||'*',Exposure:l.exposure,Owners:(l.owners||[]).length,Confidence:l.confidence,Warnings:warnCount(l.id),raw:l}));if(view=='Public')r=r.filter(x=>publicL(x.raw));if(view=='Conflicts')r=r.filter(x=>x.Warnings||x.Owners>1);if(view=='Workloads')r=snap.workloads.map(w=>({id:w.id,kind:'workload',Name:w.name,Runtime:w.runtime,State:w.state,Health:w.health||'',Warnings:warnCount(w.id),raw:w}));if(view=='Processes')r=snap.processes.map(p=>({id:JSON.stringify(p.key),kind:'process',PID:p.pid,Command:(p.command||[]).join(' ')||p.exe||'',User:p.user||'',CWD:p.cwd||'',Parent:p.parent_pid||'',raw:p}));if(view=='Projects')r=snap.projects.map(p=>({id:p.id,kind:'project',Name:p.name,Root:p.root,Markers:(p.markers||[]).join(', '),raw:p}));if(view=='Managers')r=snap.managers.map(m=>({id:m.id,kind:'manager',Name:m.name,Runtime:m.runtime,State:m.state||'',raw:m}));if(view=='Tracked runs')r=snap.tracked_runs.map(x=>({id:x.id,kind:'run',ID:x.id,State:x.state,PID:x.pid||'',Tag:x.tag||'',raw:x}));if(view=='Warnings')r=snap.warnings.map((w,i)=>({id:String(i),kind:'warning',Severity:w.severity,Code:w.code,Message:w.message,Entity:JSON.stringify(w.entity||''),raw:w}));if(view=='Discovery health')r=[{Adapter:'snapshot',Status:'authoritative',Events:'refresh hints only',Dropped:snap.metadata.events_dropped||0,raw:snap.metadata}];const filter=q.value.toLowerCase();if(filter)r=r.filter(x=>JSON.stringify(x).toLowerCase().includes(filter));if(sortKey)r.sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),undefined,{numeric:true})*sortDir);return r}
function renderTable(){const r=rows(),keys=Object.keys(r[0]||{}).filter(k=>!['raw','id','kind'].includes(k));thead.innerHTML='<tr>'+keys.map(k=>`<th data-k="${k}">${k}</th>`).join('')+'</tr>';tbody.innerHTML=r.map(x=>`<tr data-id="${x.id}" class="${selected==x.id?'selected':''}">`+keys.map(k=>`<td class="${k=='Exposure'&&publicL(x.raw)?'public':''}">${x[k]??''}</td>`).join('')+'</tr>').join('')||'<tr><td class=muted>Empty snapshot/view.</td></tr>';thead.querySelectorAll('th').forEach(th=>th.onclick=()=>{sortDir=sortKey==th.dataset.k?-sortDir:1;sortKey=th.dataset.k;renderTable()});tbody.querySelectorAll('tr').forEach((tr,i)=>tr.onclick=()=>{selected=r[i]?.id;setParam('selected',selected);document.querySelector('#inspector').innerHTML=`<pre>${JSON.stringify(r[i]?.raw,null,2)}</pre>`;renderTable()})}
</script></body></html>
