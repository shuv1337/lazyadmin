name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration_linux:
        description: Run gated Linux integration jobs
        type: boolean
        default: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
  clippy-test-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts
          cargo run -p lazyadmin-cli -- doctor --json > artifacts/doctor.json || true
          cargo run -p lazyadmin-cli -- export --json > artifacts/snapshot.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lazyadmin-failure-artifacts
          path: artifacts
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p lazyadmin-cli
      - name: Build skill tarball
        id: skill
        run: echo "tarball=$(scripts/build-skill-tarball.sh)" >> "$GITHUB_OUTPUT"
      - name: Verify tarball contents
        # `tar -tzf` only accepts a single archive; the previous
        # `lazyadmin-agent-skill-v*.tar.gz` glob would silently break the
        # moment more than one tarball existed in the workspace.
        run: tar -tzf "${{ steps.skill.outputs.tarball }}" | grep 'lazyadmin-agent/SKILL.md'
  integration-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.integration_linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --features integration-linux -- --ignored
